name: Bug report
description: Report incorrect or unexpected behaviour that is not a private vulnerability.
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities or sensitive media here. Follow SECURITY.md for private reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use synthetic, non-sensitive fixtures and list exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, device, and revision
    validations:
      required: true
