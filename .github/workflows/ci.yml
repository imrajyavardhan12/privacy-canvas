name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable pnpm
          pnpm --version

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install independent PNG inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libimage-exiftool-perl
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output /tmp/c2patool.tar.gz \
            https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v0.27.7/c2patool-v0.27.7-x86_64-unknown-linux-gnu.tar.gz
          echo "54acbd44beb88e71b29f31e29e1ce8a62d7e0b37d087574275fac579dfb36e03  /tmp/c2patool.tar.gz" | sha256sum --check
          mkdir /tmp/c2patool
          tar --extract --gzip --file /tmp/c2patool.tar.gz \
            --directory /tmp/c2patool --strip-components=1 c2patool/c2patool
          sudo install --mode 0755 /tmp/c2patool/c2patool /usr/local/bin/c2patool
          exiftool -ver
          c2patool --version

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Run static checks, tests, and build
        run: pnpm run check

      - name: Install browser test engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run browser tests
        run: pnpm run test:e2e
